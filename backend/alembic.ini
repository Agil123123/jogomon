# Alembic configuration for JOGO-MON
# Uses async SQLAlchemy with asyncpg

[alembic]
# Path to migration scripts
script_location = alembic

# Template used for migration filenames
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Max length of slug in filenames
max_length = 80

# Truncate long revision IDs
truncate_slug_length = 40

# Set to 'true' to run the environment during run_migrations
prepend_sys_path = .

# Output encoding for migration files
output_encoding = utf-8

# Database URL - will be overridden by env.py from app config
# sqlalchemy.url = postgresql+asyncpg://user:pass@localhost/db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
