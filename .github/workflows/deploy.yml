name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        run: |
          missing=0
          [ -z "${{ secrets.VPS_HOST }}" ] && echo "❌ VPS_HOST belum diisi" && missing=1
          [ -z "${{ secrets.VPS_USER }}" ] && echo "❌ VPS_USER belum diisi" && missing=1
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ] && [ -z "${{ secrets.VPS_PASSWORD }}" ]; then
            echo "❌ VPS_SSH_KEY / VPS_PASSWORD belum diisi (salah satu wajib)"
            missing=1
          fi
          if [ $missing -eq 1 ]; then
            echo ""
            echo "→ Buka https://github.com/Agil123123/jogomon/settings/secrets/actions"
            echo "  Tambah: VPS_HOST=103.20.88.83, VPS_USER=fams (bukan root), VPS_PORT=22, VPS_PASSWORD=(password user fams) atau VPS_SSH_KEY"
            exit 1
          fi
          echo "✅ Secrets OK — VPS_USER=${{ secrets.VPS_USER }}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "=== Who am I ==="
            whoami; id; sudo -n true && echo "sudo NOPASSWD ok" || echo "sudo perlu password (pakai -S)"

            # helper: pakai password dari env (aman dari karakter '!$#) biar sudo jalan meski belum NOPASSWD
            # appleboy inject VPS_PASSWORD sebagai env di remote shell otomatis
            SUDO_PASS="$VPS_PASSWORD"
            export SUDO_PASS
            # cache sudo biar next sudo ga minta lagi (5 menit)
            printf '%s\n' "$SUDO_PASS" | sudo -S true 2>/dev/null || true

            echo "=== Pull latest ==="
            printf '%s\n' "$SUDO_PASS" | sudo -S chown -R root:root /opt/jogomon/.git 2>/dev/null || true
            cd /opt/jogomon
            if ! printf '%s\n' "$SUDO_PASS" | sudo -S git fetch origin main 2>&1; then
              echo "git fetch gagal, re-clone..."
              cd /opt
              printf '%s\n' "$SUDO_PASS" | sudo -S rm -rf jogomon.bak || true
              printf '%s\n' "$SUDO_PASS" | sudo -S mv jogomon jogomon.bak || true
              printf '%s\n' "$SUDO_PASS" | sudo -S git clone --branch main https://github.com/Agil123123/jogomon.git jogomon
              printf '%s\n' "$SUDO_PASS" | sudo -S cp /opt/jogomon.bak/.env /opt/jogomon/.env 2>/dev/null || true
            else
              printf '%s\n' "$SUDO_PASS" | sudo -S git reset --hard origin/main
            fi
            printf '%s\n' "$SUDO_PASS" | sudo -S chown -R jogomon:jogomon /opt/jogomon
            git log --oneline -3

            echo "=== Backend: install + migrate ==="
            cd /opt/jogomon/backend
            printf '%s\n' "$SUDO_PASS" | sudo -S -u jogomon .venv/bin/pip install -r requirements.txt
            printf '%s\n' "$SUDO_PASS" | sudo -S -u jogomon .venv/bin/alembic upgrade head || true

            echo "=== Frontend: install + build ==="
            cd /opt/jogomon/frontend
            printf '%s\n' "$SUDO_PASS" | sudo -S -u jogomon npm ci
            printf '%s\n' "$SUDO_PASS" | sudo -S -u jogomon npm run build

            echo "=== Nginx ==="
            printf '%s\n' "$SUDO_PASS" | sudo -S cp /opt/jogomon/deploy/nginx/jogomon.conf /etc/nginx/sites-available/jogomon
            printf '%s\n' "$SUDO_PASS" | sudo -S nginx -t
            printf '%s\n' "$SUDO_PASS" | sudo -S systemctl reload nginx

            echo "=== Restart services ==="
            printf '%s\n' "$SUDO_PASS" | sudo -S systemctl restart jogomon-backend
            printf '%s\n' "$SUDO_PASS" | sudo -S systemctl restart jogomon-frontend
            printf '%s\n' "$SUDO_PASS" | sudo -S systemctl is-active jogomon-backend
            printf '%s\n' "$SUDO_PASS" | sudo -S systemctl is-active jogomon-frontend

            echo "=== Health check ==="
            sleep 3
            curl -fsS http://127.0.0.1:8100/health; echo
            curl -fsS http://127.0.0.1:3100/ | head -c 200; echo
            echo "=== DONE ==="
