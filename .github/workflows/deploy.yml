name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        run: |
          missing=0
          [ -z "${{ secrets.VPS_HOST }}" ] && echo "❌ VPS_HOST belum diisi" && missing=1
          [ -z "${{ secrets.VPS_USER }}" ] && echo "❌ VPS_USER belum diisi" && missing=1
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ] && [ -z "${{ secrets.VPS_PASSWORD }}" ]; then
            echo "❌ VPS_SSH_KEY / VPS_PASSWORD belum diisi (salah satu wajib)"
            missing=1
          fi
          if [ $missing -eq 1 ]; then
            echo ""
            echo "→ Buka https://github.com/Agil123123/jogomon/settings/secrets/actions"
            echo "  Tambah: VPS_HOST=103.20.88.83, VPS_USER=root, VPS_PORT=22, VPS_SSH_KEY=(private key) atau VPS_PASSWORD"
            exit 1
          fi
          echo "✅ Secrets OK"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "=== Pull latest ==="
            # /opt/jogomon dulunya di-clone sebagai jogomon:jogomon, jadi root gabisa nulis FETCH_HEAD
            chown -R root:root /opt/jogomon/.git 2>/dev/null || true
            cd /opt/jogomon
            # fallback kalau .git kepemilikan berantakan: re-clone
            if ! git fetch origin main 2>&1; then
              echo "git fetch gagal, re-clone..."
              cd /opt
              rm -rf jogomon.bak && mv jogomon jogomon.bak || true
              git clone --branch main https://github.com/Agil123123/jogomon.git jogomon
            else
              git reset --hard origin/main
            fi
            chown -R jogomon:jogomon /opt/jogomon

            echo "=== Backend: install + migrate ==="
            cd /opt/jogomon/backend
            sudo -u jogomon .venv/bin/pip install -r requirements.txt
            sudo -u jogomon .venv/bin/alembic upgrade head || true

            echo "=== Frontend: install + build ==="
            cd /opt/jogomon/frontend
            sudo -u jogomon npm ci
            sudo -u jogomon npm run build

            echo "=== Nginx ==="
            cp /opt/jogomon/deploy/nginx/jogomon.conf /etc/nginx/sites-available/jogomon
            nginx -t && systemctl reload nginx

            echo "=== Restart services ==="
            systemctl restart jogomon-backend
            systemctl restart jogomon-frontend
            systemctl is-active jogomon-backend
            systemctl is-active jogomon-frontend

            echo "=== Health check ==="
            sleep 3
            curl -fsS http://127.0.0.1:8100/health
            curl -fsS http://127.0.0.1:3100/ | head -c 200
            echo ""
            echo "=== DONE ==="
