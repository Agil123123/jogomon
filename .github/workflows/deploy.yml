name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        run: |
          missing=0
          [ -z "${{ secrets.VPS_HOST }}" ] && echo "❌ VPS_HOST belum diisi" && missing=1
          [ -z "${{ secrets.VPS_USER }}" ] && echo "❌ VPS_USER belum diisi" && missing=1
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ] && [ -z "${{ secrets.VPS_PASSWORD }}" ]; then
            echo "❌ VPS_SSH_KEY / VPS_PASSWORD belum diisi (salah satu wajib)"
            missing=1
          fi
          if [ $missing -eq 1 ]; then
            echo ""
            echo "→ Buka https://github.com/Agil123123/jogomon/settings/secrets/actions"
            echo "  Tambah: VPS_HOST=103.20.88.83, VPS_USER=fams (bukan root), VPS_PORT=22, VPS_PASSWORD=(password user fams) atau VPS_SSH_KEY"
            exit 1
          fi
          echo "✅ Secrets OK — VPS_USER=${{ secrets.VPS_USER }}"

      - name: Deploy via SSH
        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: VPS_PASSWORD
          script: |
            set -e
            echo "=== Who am I ==="
            whoami; id
            # Hybrid sudo: NOPASSWD (visudo) atau fallback pakai VPS_PASSWORD via envs
            if sudo -n true 2>/dev/null; then
              echo "sudo NOPASSWD ok"
              SUDO="sudo"
            else
              echo "sudo pakai password (fallback via VPS_PASSWORD env)"
              if [ -z "$VPS_PASSWORD" ]; then echo "VPS_PASSWORD kosong — cek Secrets"; exit 1; fi
              printf '%s\n' "$VPS_PASSWORD" | sudo -S true 2>/dev/null || true
              SUDO="sudo -S"
            fi

            echo "=== Pull latest (fix FETCH_HEAD permission) ==="
            # FIX esensial: chown KE jogomon SEBELUM git, lalu fetch sebagai jogomon
            if [ "$SUDO" = "sudo" ]; then
              sudo chown -R jogomon:jogomon /opt/jogomon
              sudo chmod -R u+w /opt/jogomon/.git 2>/dev/null || true
              cd /opt/jogomon
              if ! sudo -u jogomon git fetch origin main 2>&1; then
                echo "git fetch gagal, re-clone..."
                cd /opt
                sudo rm -rf jogomon.bak || true
                sudo mv jogomon jogomon.bak || true
                sudo git clone --branch main https://github.com/Agil123123/jogomon.git jogomon
                sudo cp /opt/jogomon.bak/.env /opt/jogomon/.env 2>/dev/null || true
                sudo chown -R jogomon:jogomon /opt/jogomon
              else
                sudo -u jogomon git reset --hard origin/main
                sudo chown -R jogomon:jogomon /opt/jogomon
              fi
              sudo -u jogomon git -C /opt/jogomon log --oneline -3 || git -C /opt/jogomon log --oneline -3 || true
            else
              printf '%s\n' "$VPS_PASSWORD" | sudo -S chown -R jogomon:jogomon /opt/jogomon
              printf '%s\n' "$VPS_PASSWORD" | sudo -S chmod -R u+w /opt/jogomon/.git 2>/dev/null || true
              cd /opt/jogomon
              if ! printf '%s\n' "$VPS_PASSWORD" | sudo -S -u jogomon git fetch origin main 2>&1; then
                echo "git fetch gagal, re-clone..."
                cd /opt
                printf '%s\n' "$VPS_PASSWORD" | sudo -S rm -rf jogomon.bak || true
                printf '%s\n' "$VPS_PASSWORD" | sudo -S mv jogomon jogomon.bak || true
                printf '%s\n' "$VPS_PASSWORD" | sudo -S git clone --branch main https://github.com/Agil123123/jogomon.git jogomon
                printf '%s\n' "$VPS_PASSWORD" | sudo -S cp /opt/jogomon.bak/.env /opt/jogomon/.env 2>/dev/null || true
                printf '%s\n' "$VPS_PASSWORD" | sudo -S chown -R jogomon:jogomon /opt/jogomon
              else
                printf '%s\n' "$VPS_PASSWORD" | sudo -S -u jogomon git reset --hard origin/main
                printf '%s\n' "$VPS_PASSWORD" | sudo -S chown -R jogomon:jogomon /opt/jogomon
              fi
              printf '%s\n' "$VPS_PASSWORD" | sudo -S -u jogomon git -C /opt/jogomon log --oneline -3 2>/dev/null || git -C /opt/jogomon log --oneline -3 || true
            fi

            echo "=== Backend: install + migrate ==="
            cd /opt/jogomon/backend
            # pip ada di /opt/jogomon/backend/.venv/bin/pip (PATH tidak ikut sudo -u)
            if [ "$SUDO" = "sudo" ]; then
              if [ -x /opt/jogomon/backend/.venv/bin/pip ]; then
                sudo -u jogomon /opt/jogomon/backend/.venv/bin/pip install -r requirements.txt
                sudo -u jogomon /opt/jogomon/backend/.venv/bin/alembic upgrade head || true
              else
                echo "venv belum ada, bikin dulu..."
                sudo -u jogomon python3 -m venv /opt/jogomon/backend/.venv
                sudo -u jogomon /opt/jogomon/backend/.venv/bin/pip install --upgrade pip
                sudo -u jogomon /opt/jogomon/backend/.venv/bin/pip install -r requirements.txt
                sudo -u jogomon /opt/jogomon/backend/.venv/bin/alembic upgrade head || true
              fi
            else
              if printf '%s\n' "$VPS_PASSWORD" | sudo -S test -x /opt/jogomon/backend/.venv/bin/pip; then
                printf '%s\n' "$VPS_PASSWORD" | sudo -S -u jogomon /opt/jogomon/backend/.venv/bin/pip install -r requirements.txt
                printf '%s\n' "$VPS_PASSWORD" | sudo -S -u jogomon /opt/jogomon/backend/.venv/bin/alembic upgrade head || true
              else
                printf '%s\n' "$VPS_PASSWORD" | sudo -S -u jogomon python3 -m venv /opt/jogomon/backend/.venv
                printf '%s\n' "$VPS_PASSWORD" | sudo -S -u jogomon /opt/jogomon/backend/.venv/bin/pip install --upgrade pip
                printf '%s\n' "$VPS_PASSWORD" | sudo -S -u jogomon /opt/jogomon/backend/.venv/bin/pip install -r requirements.txt
                printf '%s\n' "$VPS_PASSWORD" | sudo -S -u jogomon /opt/jogomon/backend/.venv/bin/alembic upgrade head || true
              fi
            fi

            echo "=== Frontend: install + build ==="
            cd /opt/jogomon/frontend
            if [ "$SUDO" = "sudo" ]; then
              sudo -u jogomon npm ci
              sudo -u jogomon npm run build
            else
              printf '%s\n' "$VPS_PASSWORD" | sudo -S -u jogomon npm ci
              printf '%s\n' "$VPS_PASSWORD" | sudo -S -u jogomon npm run build
            fi

            echo "=== Nginx ==="
            if [ "$SUDO" = "sudo" ]; then
              sudo cp /opt/jogomon/deploy/nginx/jogomon.conf /etc/nginx/sites-available/jogomon
              sudo nginx -t
              sudo systemctl reload nginx
            else
              printf '%s\n' "$VPS_PASSWORD" | sudo -S cp /opt/jogomon/deploy/nginx/jogomon.conf /etc/nginx/sites-available/jogomon
              printf '%s\n' "$VPS_PASSWORD" | sudo -S nginx -t
              printf '%s\n' "$VPS_PASSWORD" | sudo -S systemctl reload nginx
            fi

            echo "=== Restart services ==="
            if [ "$SUDO" = "sudo" ]; then
              sudo systemctl restart jogomon-backend
              sudo systemctl restart jogomon-frontend
              sudo systemctl is-active jogomon-backend
              sudo systemctl is-active jogomon-frontend
            else
              printf '%s\n' "$VPS_PASSWORD" | sudo -S systemctl restart jogomon-backend
              printf '%s\n' "$VPS_PASSWORD" | sudo -S systemctl restart jogomon-frontend
              printf '%s\n' "$VPS_PASSWORD" | sudo -S systemctl is-active jogomon-backend
              printf '%s\n' "$VPS_PASSWORD" | sudo -S systemctl is-active jogomon-frontend
            fi

            echo "=== Health check ==="
            set +e
            sleep 4
            echo "--- backend :8100/health (retry) ---"
            for i in 1 2 3; do curl -fsS http://127.0.0.1:8100/health && echo " -> backend OK" && break; echo "retry $i..."; sleep 3; done || echo "WARN backend health gagal (cek systemctl status jogomon-backend)"
            echo "--- frontend :3100/ ---"
            curl -fsS http://127.0.0.1:3100/ | head -c 300; echo
            echo "--- public https health (optional) ---"
            curl -fsSk https://jogomon.joglonet.my.id/health 2>&1 | head -c 200; echo
            set -e
            echo "=== DONE ==="
